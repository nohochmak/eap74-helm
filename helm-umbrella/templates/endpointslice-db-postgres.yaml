apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.runtime.database.serviceName }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: postgresql
      protocol: TCP
      port: {{ .Values.runtime.database.port }}
      targetPort: {{ .Values.runtime.database.port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Values.runtime.database.serviceName }}-1
  namespace: {{ .Release.Namespace }}
  labels:
    kubernetes.io/service-name: {{ .Values.runtime.database.serviceName }}
addressType: IPv4
ports:
  - name: postgresql
    protocol: TCP
    port: {{ .Values.runtime.database.port }}
endpoints:
  - addresses:
      - {{ .Values.runtime.database.externalIp | quote }}