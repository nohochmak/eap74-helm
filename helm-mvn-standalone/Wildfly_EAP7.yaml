apiVersion: wildfly.org/v1alpha1
kind: WildFlyServer
metadata:
  name: multi-war-mvn
  namespace: multi-war-helm-mvn
spec:
  serviceAccountName: coolstoresa
  applicationImage: multi-war-coolstore:latest
  replicas: 1

  env:
    # Prevents the EAP image startup script from running /tmp/cli-script-*.cli
    - name: DISABLE_BOOT_SCRIPT_INVOKER
      value: "true"
    # Force EAP to boot with your mounted configuration and KUBE_PING clustering
    - name: WILDFLY_SERVER_CONFIGURATION
      value: "standalone-openshift.xml"
    - name: JGROUPS_PING_PROTOCOL
      value: "openshift.KUBE_PING"
    - name: KUBERNETES_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

    # Database credentials injected from Kubernetes Secret for standalone-full-ha.xml
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: eap-db-credentials
          key: database-user
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: eap-db-credentials
          key: database-password

