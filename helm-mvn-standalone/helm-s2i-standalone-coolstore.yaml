image:
  tag: latest
nexus:
  username: "admin"
  password: "password"
  url: "http://nexus3.multi-war-helm-mvn.svc.cluster.local/repository/maven-releases/"

maven:
  mirrors:
    - id: internal-nexus
      name: Internal Nexus Mirror
      url: "http://nexus3.multi-war-helm-mvn.svc.cluster.local/repository/maven-releases/"
      mirrorOf: "*"
      
  servers:
    - id: internal-nexus
      username: "admin"
      password: "password"


build:
  enabled: true
  mode: s2i
  uri: 'https://github.com/nohochmak/eap74-helm.git'
  ref: main
  # Point to the Git directory where coolstore Pom.xml resides
  contextDir: war-collector-coolstore

  output:
    kind: ImageStreamTag
  env:
    - name: MAVEN_ARGS_APPEND
      value: "-Dcom.redhat.xpaas.repo.jbossorg"
      # 4. Critical Cloud HA Environment variables required by standalone-full-ha
    - name: WILDFLY_SERVER_CONFIGURATION
      value: "standalone-openshift.xml"
    - name: JGROUPS_PING_PROTOCOL
      value: "openshift.KUBE_PING"
    - name: KUBERNETES_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

   
    # Credentials to connect to Nexus on OCP
    - name: NEXUS_OCP_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: nexus-credentials
    - name: NEXUS_OCP_USER
      valueFrom:
        secretKeyRef:
          key: username
          name: nexus-credentials



  s2i:
    # 1. Instruct the S2I build engine to skip Galleon provisioning
    galleonEnabled: "false"
    
    # 2. Prevent S2I from generating an isolated cloud-default-config XML file
    env:
      - name: DISABLE_GALLEON
        value: "true"
      - name: EAP_ONLY_DEPLOYMENTS
        value: "true"

    version: latest
    arch: amd64
    jdk: '8'
    amd64:
      jdk8:
        # 2026nov06 - Using ELS versions of base RHEL 8 - NOTE: change of Maven version in newer images
        #             causes block of non-https repo connections.
        # builderImage: registry.redhat.io/jboss-eap-7/eap74-els-openjdk8-openshift-rhel8
        # runtimeImage: registry.redhat.io/jboss-eap-7/eap74-els-openjdk8-runtime-openshift-rhel8
        builderImage: registry.redhat.io/jboss-eap-7/eap74-openjdk8-openshift-rhel7
        runtimeImage: registry.redhat.io/jboss-eap-7/eap74-openjdk8-runtime-openshift-rhel7
      jdk11:
        builderImage: registry.redhat.io/jboss-eap-7/eap74-openjdk11-openshift-rhel8
        runtimeImage: registry.redhat.io/jboss-eap-7/eap74-openjdk11-runtime-openshift-rhel8
  
  # 3. Inject your legacy configuration into the running container
  # configMaps:
  #   - name: eap-stal-coolstore
  #     mountPath: /opt/eap/standalone/configuration/standalone-openshift.xml
  #     subPath: standalone-openshift.xml

  triggers: {}

deploy:
  enabled: false
