    to:
      kind: ImageStreamTag
      name: multi-war-coolstore:latest
  source:
    dockerfile: |-
      FROM registry.redhat.io/jboss-eap-7/eap74-openjdk8-runtime-openshift-rhel7:latest
      COPY /server $JBOSS_HOME
      USER root
      RUN chown -R jboss:root $JBOSS_HOME && chmod -R ug+rwX $JBOSS_HOME
      USER jboss
      CMD $JBOSS_HOME/bin/openshift-launch.sh
    images:
    - from:
        kind: ImageStreamTag
        name: multi-war-coolstore-build-artifacts:latest
      paths:
      - destinationDir: .
        sourcePath: /s2i-output/server/
    type: Docker
  strategy:
    dockerStrategy:
      from:
        kind: DockerImage
        name: registry.redhat.io/jboss-eap-7/eap74-openjdk8-runtime-openshift-rhel7:latest
    type: Docker
  triggers:
  - imageChange:
      from:
        kind: ImageStreamTag
        name: multi-war-coolstore-build-artifacts:latest
    type: ImageChange
  - type: ConfigChange
