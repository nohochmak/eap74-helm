# Route - sub-context path for helloworld-rs
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: route-helloworld-rs
  namespace: multi-war-helm-mvn
  labels:
    app.kubernetes.io/name: multi-war-app

spec:
  host: multi-war-mvn-route-multi-war-helm-mvn.apps-crc.testing
  # host: multi-war-app-route-multi-war-helm-mvn.apps-crc.testing
  path: /helloworld-rs        # The specific sub-context path
  to:
    kind: Service
    name: multi-war-mvn-loadbalancer
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
#  tls:
#    termination: edge         # Optional: for HTTPS